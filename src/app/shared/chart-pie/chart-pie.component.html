<div class="flex items-center justify-between">
  <mat-form-field appearance="fill">
    <mat-label>Chart Type</mat-label>
    <mat-select [(value)]="selectedChartType" (selectionChange)="updateSetting_type($event)">
      <mat-option [value]="1">Pie</mat-option>
      <mat-option [value]="2">Bar</mat-option>
    </mat-select>
  </mat-form-field>

  <!-- <button type="button" mat-raised-button color="primary" >Download Tasks in Excel with Tasks Status Chart</button> -->
  <button type="button" mat-raised-button color="basic" (click)="chartToImg()" class="w-100" >
    Download Tasks Status Chart
  </button>
</div>
  <!-- selectedChartType-{{selectedChartType}} -->

<div class="chart-container">
    <canvas *ngIf="selectedChartType == 1" id="pieChart" >{{ chart }}</canvas>
    <canvas *ngIf="selectedChartType == 2" id="barChart" >{{ chart }}</canvas>
</div>
