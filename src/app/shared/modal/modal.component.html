
<!-- chart
loginTimeOut
taskCountError
userCreated
userVerified -->

<div class="modale opened" [class]="infoModalType+' '+infoModalCategory">
    <div class="modal-dialog">
        <div class="modal-header">
            <ng-content select="header"></ng-content>
            <!-- <a href="#" class="btn-close closemodale" aria-hidden="true">&times;</a> -->
        </div>
        <div class="modal-body"  *ngIf="infoModalType !== 'chart';">
            <ng-content select="body"></ng-content>
        </div>
        <div class="modal-body"  *ngIf="infoModalType === 'chart';">
            <body><app-chart-pie></app-chart-pie></body>
        </div>
        <div class="modal-footer" *ngIf="infoModalType === 'loginTimeOut' || infoModalType === 'userVerified';">
            <p>Redirecting to Login in {{tmr}}/5 seconds</p>
            <button type="button" mat-raised-button color="primary" (click)="goBack()" class="btn" >Goto Login</button>
        </div>
        <div class="modal-footer" #standardModalFooter  *ngIf="infoModalType == 'taskCountError' || infoModalType == 'chart'  || infoModalType == 'common'">
            <button type="button" mat-raised-button color="primary" (click)="closeModal()" class="btn" >Close</button>
        </div>
    </div>
</div>
